<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGrad4)" stroke="#334155" stroke-width="1.5"/>

  <!-- Título Principal -->
  <text x="480" y="45" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Métodos para Projeto de Casos de Teste</text>
  <text x="480" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Duas famílias complementares para projetar testes de alta eficácia com custo controlado</text>

  <!-- Lado Esquerdo: Caixa-Preta -->
  <g transform="translate(50, 105)" filter="url(#shadow4)">
    <rect width="415" height="340" rx="12" fill="url(#bbGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="415" height="46" rx="12" fill="#0284c7" fill-opacity="0.4"/>
    <text x="207" y="28" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Técnicas de Caixa-Preta (Funcional)</text>
    
    <g transform="translate(20, 65)" font-family="system-ui, sans-serif" fill="#e2e8f0">
      <rect x="0" y="0" width="375" height="24" rx="4" fill="#0369a1" fill-opacity="0.4"/>
      <text x="187" y="16" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">BASEADO EM ESPECIFICAÇÃO &amp; REQUISITOS</text>

      <g transform="translate(5, 40)" font-size="12.5">
        <text x="0" y="14" font-weight="700" fill="#38bdf8">1. Particionamento em Classes de Equivalência</text>
        <text x="14" y="32" fill="#94a3b8" font-size="11">Divide domínio em conjuntos válidos e inválidos homogêneos.</text>

        <text x="0" y="66" font-weight="700" fill="#38bdf8">2. Análise de Valor-Limite (Fronteiras)</text>
        <text x="14" y="84" fill="#94a3b8" font-size="11">Foca nos limites exatos, imediatos anteriores e posteriores.</text>

        <text x="0" y="118" font-weight="700" fill="#38bdf8">3. Tabelas de Decisão</text>
        <text x="14" y="136" fill="#94a3b8" font-size="11">Combinações complexas de regras lógicas e ações.</text>

        <text x="0" y="170" font-weight="700" fill="#38bdf8">4. Teste de Transição de Estados</text>
        <text x="14" y="188" fill="#94a3b8" font-size="11">Eventos, condições e mudanças de estado do sistema.</text>
      </g>
    </g>
  </g>

  <!-- Lado Direito: Caixa-Branca -->
  <g transform="translate(495, 105)" filter="url(#shadow4)">
    <rect width="415" height="340" rx="12" fill="url(#wbGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect width="415" height="46" rx="12" fill="#7c3aed" fill-opacity="0.4"/>
    <text x="207" y="28" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Técnicas de Caixa-Branca (Estrutural)</text>
    
    <g transform="translate(20, 65)" font-family="system-ui, sans-serif" fill="#e2e8f0">
      <rect x="0" y="0" width="375" height="24" rx="4" fill="#4c1d95" fill-opacity="0.4"/>
      <text x="187" y="16" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">BASEADO NO CÓDIGO-FONTE &amp; FLUXO LÓGICO</text>

      <g transform="translate(5, 40)" font-size="12.5">
        <text x="0" y="14" font-weight="700" fill="#a78bfa">1. Teste de Caminhos Básicos</text>
        <text x="14" y="32" fill="#94a3b8" font-size="11">Grafo de fluxo e caminhos linearmente independentes.</text>

        <text x="0" y="66" font-weight="700" fill="#a78bfa">2. Complexidade Ciclomática V(G) de McCabe</text>
        <text x="14" y="84" fill="#94a3b8" font-size="11">Métrica que define o número mínimo de casos de teste necessários.</text>

        <text x="0" y="118" font-weight="700" fill="#a78bfa">3. Cobertura de Instruções, Ramos e Condições</text>
        <text x="14" y="136" fill="#94a3b8" font-size="11">Garante a execução de todas as linhas e decisões booleanas.</text>

        <text x="0" y="170" font-weight="700" fill="#a78bfa">4. Teste de Fluxo de Dados e Ciclos</text>
        <text x="14" y="188" fill="#94a3b8" font-size="11">Ciclos de vida de variáveis e repetições (laços).</text>
      </g>
    </g>
  </g>
</svg>