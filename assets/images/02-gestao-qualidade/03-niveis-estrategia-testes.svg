<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow3" x="-3%" y="-4%" width="106%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Título Principal -->
  <text x="480" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Estratégia e Níveis de Teste de Software</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Roteiro progressivo em camadas: do componente atômico à validação de sistema completo</text>

  <!-- Nível 4: Teste de Sistema -->
  <g transform="translate(90, 95)" filter="url(#shadow3)">
    <rect width="810" height="74" rx="10" fill="#1e1b4b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="170" height="74" rx="10" fill="#4338ca" fill-opacity="0.8"/>
    <text x="85" y="34" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4. SISTEMA</text>
    <text x="85" y="53" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11">Visão Global</text>
    
    <text x="195" y="32" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Integração com ambiente real, infraestrutura e hardware</text>
    <text x="195" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Tipos: Testes de Recuperação (*Recovery*), Segurança, Estresse (*Stress*) e Desempenho (*Performance*).</text>
  </g>

  <!-- Nível 3: Teste de Validação -->
  <g transform="translate(90, 188)" filter="url(#shadow3)">
    <rect width="810" height="74" rx="10" fill="#064e3b" fill-opacity="0.8" stroke="#34d399" stroke-width="1.5"/>
    <rect width="170" height="74" rx="10" fill="#059669" fill-opacity="0.8"/>
    <text x="85" y="34" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. VALIDAÇÃO</text>
    <text x="85" y="53" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Foco no Cliente</text>
    
    <text x="195" y="32" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Conformidade com requisitos do negócio e expectativas do usuário</text>
    <text x="195" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Critérios de Aceitação, Testes Alfa (ambiente controlado) e Testes Beta (ambiente real do cliente).</text>
  </g>

  <!-- Nível 2: Teste de Integração -->
  <g transform="translate(90, 281)" filter="url(#shadow3)">
    <rect width="810" height="74" rx="10" fill="#0c4a6e" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="170" height="74" rx="10" fill="#0284c7" fill-opacity="0.8"/>
    <text x="85" y="34" text-anchor="middle" fill="#f0f9ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. INTEGRAÇÃO</text>
    <text x="85" y="53" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">Comunicação</text>
    
    <text x="195" y="32" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Interfaces, troca de dados e compatibilidade entre módulos</text>
    <text x="195" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Estratégias: Top-Down (com *stubs*), Bottom-Up (com *drivers*), Testes de Fumaça e Regressão.</text>
  </g>

  <!-- Nível 1: Teste de Unidade -->
  <g transform="translate(90, 374)" filter="url(#shadow3)">
    <rect width="810" height="74" rx="10" fill="#701a75" fill-opacity="0.8" stroke="#f472b6" stroke-width="1.5"/>
    <rect width="170" height="74" rx="10" fill="#c026d3" fill-opacity="0.8"/>
    <text x="85" y="34" text-anchor="middle" fill="#fdf4ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. UNIDADE</text>
    <text x="85" y="53" text-anchor="middle" fill="#f5d0fe" font-family="system-ui, sans-serif" font-size="11">Base do Código</text>
    
    <text x="195" y="32" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Menor unidade de código: funções, métodos e classes isoladas</text>
    <text x="195" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Verificação da lógica interna, caminhos de execução, limites e exceções.</text>
  </g>

  <!-- Seta indicativa de progressão lateral -->
  <path d="M 50 425 L 50 135" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <text x="38" y="280" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1" transform="rotate(-90 38 280)">PROGRESSÃO DA ESTRATÉGIA</text>
</svg>