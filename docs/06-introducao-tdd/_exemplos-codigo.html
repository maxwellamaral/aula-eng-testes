<template id="codigo-5" data-language="python" data-label="Cenário de RF001 — narrativa comentada"><pre><code><span class="ce-c1"># Arquivo: bvapp-didatico/functional_tests/test_rf001_inclusao_painel.py</span>
<span class="ce-c1"># Cenário: observar a página inicial de inclusão de painel solar.</span>
<span class="ce-c1"># Referência: redação atual de RF001 e contrato didático.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># A aplicação didática está em execução e há um navegador disponível</span>
<span class="ce-c1"># para o teste. Não é necessário cadastrar ou salvar um painel</span>
<span class="ce-c1"># para observar esta página.</span>
<span class="ce-c1"># O país configurado no sistema e seu padrão de data são conhecidos</span>
<span class="ce-c1"># na preparação do teste, sem presumir um país ou formato específico.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Uma pessoa usuária quer conhecer a página em que poderá iniciar</span>
<span class="ce-c1"># a inclusão de um painel solar. Ela acessa essa página no navegador.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Ao abrir a página, ela encontra uma identificação visível de que</span>
<span class="ce-c1"># está na página de inclusão de painel solar.</span>
<span class="ce-c1"># O teste deverá verificar essa identificação, não apenas confirmar</span>
<span class="ce-c1"># que a aplicação respondeu à solicitação.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Ela encontra o campo Número de Série, com um controle de texto</span>
<span class="ce-c1"># visível e identificado para informar o número de série do painel.</span>
<span class="ce-c1"># O teste deverá verificar o controle correspondente ao campo;</span>
<span class="ce-c1"># encontrar somente as palavras "Número de Série" não será suficiente.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Ela também encontra o campo Cooperado, apresentado como uma lista</span>
<span class="ce-c1"># visível e identificada para a seleção de um cooperado.</span>
<span class="ce-c1"># O teste deverá verificar esse controle, não apenas a presença</span>
<span class="ce-c1"># da palavra "Cooperado" em algum lugar da página.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Ela encontra Marca como uma lista de valores e Modelo como</span>
<span class="ce-c1"># um campo de texto, ambos visíveis e identificados.</span>
<span class="ce-c1"># O teste deverá verificar cada controle e sua identificação.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Ela encontra Potência de Pico (Wp) e Eficiência (%) como campos</span>
<span class="ce-c1"># numéricos, visíveis e identificados com as unidades correspondentes.</span>
<span class="ce-c1"># O teste deverá verificar os dois controles e suas identificações,</span>
<span class="ce-c1"># sem acrescentar limites numéricos que RF001 não definiu.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Ela encontra Data de Fabricação como um campo de data.</span>
<span class="ce-c1"># O teste deverá verificar o controle, sua identificação e a forma</span>
<span class="ce-c1"># de apresentação da data conforme o país configurado no sistema.</span>
<span class="ce-c1"># Não basta verificar que o controle existe para concluir</span>
<span class="ce-c1"># que sua apresentação respeita essa configuração.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Ela encontra Situação como uma lista de valores, Fornecedor como</span>
<span class="ce-c1"># um campo de texto e Inversor ativo como uma lista de valores.</span>
<span class="ce-c1"># O teste deverá verificar cada controle visível e sua identificação.</span>
<span class="ce-c1"># Não presumimos opções específicas para as listas que RF001</span>
<span class="ce-c1"># não enumerou, nem trocamos Fornecedor por uma lista de valores.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Junto a Número de Série, Cooperado e Fornecedor, ela encontra</span>
<span class="ce-c1"># a indicação de que os três campos são obrigatórios.</span>
<span class="ce-c1"># O teste deverá verificar essas indicações conforme RF001.</span>
<span class="ce-c1"># Nesta redação, o asterisco identifica os campos obrigatórios;</span>
<span class="ce-c1"># não estendemos essa marcação aos demais campos por suposição.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Com essas observações, ela reconhece a finalidade da página,</span>
<span class="ce-c1"># encontra os dez controles previstos em RF001 e reconhece</span>
<span class="ce-c1"># a obrigatoriedade de Número de Série, Cooperado e Fornecedor.</span>
<span class="ce-c1"># O cenário termina aqui, sem preencher ou submeter o formulário.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Este cenário não verifica gravação, rejeição de dados incompletos,</span>
<span class="ce-c1"># filtros, herança de Usina, mensagem de sucesso ou auditoria.</span>
<span class="ce-c1"># A indicação visual de obrigatoriedade não comprova que a aplicação</span>
<span class="ce-c1"># rejeitará uma submissão sem Cooperado: isso exige outro cenário.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Cenário complementar: herdar informações da Usina pelo Inversor.</span>
<span class="ce-c1"># Este comportamento não é verificado apenas ao abrir a página.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Para este teste, há um Inversor ativo disponível e sua Usina</span>
<span class="ce-c1"># associada é conhecida. Os dados de preparação registram</span>
<span class="ce-c1"># as informações dessa Usina que devem ser herdadas.</span>
<span class="ce-c1"># A pessoa usuária seleciona esse Inversor na lista correspondente.</span>
<span class="ce-c1"># O teste deverá verificar que as informações herdadas correspondem</span>
<span class="ce-c1"># à Usina associada ao Inversor selecionado.</span>
<span class="ce-c1"># RF001 não enumera essas informações nem como serão apresentadas:</span>
<span class="ce-c1"># esclarecemos esses detalhes antes de escrever as asserções concretas.</span>
<span class="ce-c1"># Não inventamos campos de Usina nem valores esperados.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Cenário complementar: registrar a auditoria da inclusão.</span>
<span class="ce-c1"># Este comportamento exige realizar a inclusão, não apenas ver a página.</span>
<span class="ce-c1">#</span>
<span class="ce-c1"># Para este teste, são conhecidos o utilizador responsável e os dados</span>
<span class="ce-c1"># necessários para realizar uma inclusão válida. A forma de realizar</span>
<span class="ce-c1"># e confirmar a inclusão deverá estar definida no contrato de teste.</span>
<span class="ce-c1"># Após a inclusão, o ID do ativo criado está disponível para comparação.</span>
<span class="ce-c1"># O teste deverá verificar o registro de auditoria correspondente,</span>
<span class="ce-c1"># contendo o ID desse ativo, o utilizador responsável, a data e a hora.</span>
<span class="ce-c1"># A preparação deverá permitir conferir data e hora de forma repetível,</span>
<span class="ce-c1"># sem presumir um fuso, formato ou tolerância que não foi definido.</span>
<span class="ce-c1"># Esses dados não são campos que a pessoa precisa digitar no formulário.</span>
<span class="ce-c1"># O meio de consultar a auditoria deverá ser definido antes de implementar</span>
<span class="ce-c1"># o teste; RF001 não especifica uma tela ou uma API para essa consulta.</span></code></pre></template>

        <span class="ce-c1"># na preparação do teste, sem presumir um país ou formato específico.</span>

        <span class="ce-bp">self</span><span class="ce-o">.</span><span class="ce-n">assertEqual</span><span class="ce-p">(</span><span class="ce-n">inversor</span><span class="ce-o">.</span><span class="ce-n">tag_name</span><span class="ce-p">,</span> <span class="ce-s2">"select"</span><span class="ce-p">)</span>

            <span class="ce-p">(</span><span class="ce-n">potencia</span><span class="ce-p">,</span> <span class="ce-s2">"Potência de Pico (Wp)"</span><span class="ce-p">),</span>

        <span class="ce-p">):</span>
            <span class="ce-n">identificador</span> <span class="ce-o">=</span> <span class="ce-n">controle</span><span class="ce-o">.</span><span class="ce-n">get_dom_attribute</span><span class="ce-p">(</span><span class="ce-s2">"id"</span><span class="ce-p">)</span>
            <span class="ce-bp">self</span><span class="ce-o">.</span><span class="ce-n">assertTrue</span><span class="ce-p">(</span><span class="ce-n">identificador</span><span class="ce-p">)</span>

            <span class="ce-n">rotulo</span> <span class="ce-o">=</span> <span class="ce-n">rotulos</span><span class="ce-p">[</span><span class="ce-mi">0</span><span class="ce-p">]</span>
            <span class="ce-bp">self</span><span class="ce-o">.</span><span class="ce-n">assertTrue</span><span class="ce-p">(</span><span class="ce-n">rotulo</span><span class="ce-o">.</span><span class="ce-n">is_displayed</span><span class="ce-p">())</span>
            <span class="ce-bp">self</span><span class="ce-o">.</span><span class="ce-n">assertEqual</span><span class="ce-p">(</span><span class="ce-n">rotulo</span><span class="ce-o">.</span><span class="ce-n">text</span><span class="ce-o">.</span><span class="ce-n">replace</span><span class="ce-p">(</span><span class="ce-s2">"*"</span><span class="ce-p">,</span> <span class="ce-s2">""</span><span class="ce-p">)</span><span class="ce-o">.</span><span class="ce-n">strip</span><span class="ce-p">(),</span> <span class="ce-n">texto_esperado</span><span class="ce-p">)</span>

        <span class="ce-bp">self</span><span class="ce-o">.</span><span class="ce-n">assertIn</span><span class="ce-p">(</span><span class="ce-s2">"*"</span><span class="ce-p">,</span> <span class="ce-n">rotulos_por_campo</span><span class="ce-p">[</span><span class="ce-s2">"Fornecedor"</span><span class="ce-p">]</span><span class="ce-o">.</span><span class="ce-n">text</span><span class="ce-p">)</span>

        <span class="ce-c1">#</span>
        <span class="ce-c1"># Com essas observações, ela reconhece a finalidade da página,</span>
        <span class="ce-c1"># encontra os dez controles previstos em RF001 e reconhece</span>
        <span class="ce-c1"># a obrigatoriedade de Número de Série, Cooperado e Fornecedor.</span>
        <span class="ce-c1"># O cenário termina aqui, sem preencher ou submeter o formulário.</span>
        <span class="ce-c1">#</span>
        <span class="ce-c1"># Este cenário não verifica gravação, rejeição de dados incompletos,</span>
        <span class="ce-c1"># filtros, herança de Usina, mensagem de sucesso ou auditoria.</span>
        <span class="ce-c1"># A indicação visual de obrigatoriedade não comprova que a aplicação</span>
        <span class="ce-c1"># rejeitará uma submissão sem Cooperado: isso exige outro cenário.</span>

    <span class="ce-nd">@skip</span><span class="ce-p">(</span><span class="ce-s2">"Pendente: definir país, padrão de data e observação do formato na interface."</span><span class="ce-p">)</span>
    <span class="ce-k">def</span><span class="ce-w"> </span><span class="ce-nf">test_apresentacao_localizada_da_data</span><span class="ce-p">(</span><span class="ce-bp">self</span><span class="ce-p">):</span>
        <span class="ce-k">raise</span> <span class="ce-ne">NotImplementedError</span><span class="ce-p">(</span><span class="ce-s2">"O oráculo da apresentação localizada ainda não foi definido."</span><span class="ce-p">)</span>

    <span class="ce-nd">@skip</span><span class="ce-p">(</span><span class="ce-s2">"Pendente: definir dados do Inversor e da Usina e informações herdadas observáveis."</span><span class="ce-p">)</span>
    <span class="ce-k">def</span><span class="ce-w"> </span><span class="ce-nf">test_heranca_de_usina</span><span class="ce-p">(</span><span class="ce-bp">self</span><span class="ce-p">):</span>
        <span class="ce-c1">#</span>
        <span class="ce-c1"># Cenário complementar: herdar informações da Usina pelo Inversor.</span>
        <span class="ce-c1"># Este comportamento não é verificado apenas ao abrir a página.</span>
        <span class="ce-c1">#</span>
        <span class="ce-c1"># Para este teste, há um Inversor ativo disponível e sua Usina</span>
        <span class="ce-c1"># associada é conhecida. Os dados de preparação registram</span>
        <span class="ce-c1"># as informações dessa Usina que devem ser herdadas.</span>
        <span class="ce-c1"># A pessoa usuária seleciona esse Inversor na lista correspondente.</span>
        <span class="ce-c1"># O teste deverá verificar que as informações herdadas correspondem</span>
        <span class="ce-c1"># à Usina associada ao Inversor selecionado.</span>
        <span class="ce-c1"># RF001 não enumera essas informações nem como serão apresentadas:</span>

        <span class="ce-c1"># Não inventamos campos de Usina nem valores esperados.</span>
        <span class="ce-k">raise</span> <span class="ce-ne">NotImplementedError</span><span class="ce-p">(</span><span class="ce-s2">"Faltam os contratos de preparação, ação e observação."</span><span class="ce-p">)</span>

    <span class="ce-nd">@skip</span><span class="ce-p">(</span><span class="ce-s2">"Pendente: definir inclusão válida, consulta da auditoria e controle de data e hora."</span><span class="ce-p">)</span>
    <span class="ce-k">def</span><span class="ce-w"> </span><span class="ce-nf">test_auditoria_da_inclusao</span><span class="ce-p">(</span><span class="ce-bp">self</span><span class="ce-p">):</span>
        <span class="ce-c1">#</span>
        <span class="ce-c1"># Cenário complementar: registrar a auditoria da inclusão.</span>
        <span class="ce-c1"># Este comportamento exige realizar a inclusão, não apenas ver a página.</span>
        <span class="ce-c1">#</span>
        <span class="ce-c1"># Para este teste, são conhecidos o utilizador responsável e os dados</span>
        <span class="ce-c1"># necessários para realizar uma inclusão válida. A forma de realizar</span>
        <span class="ce-c1"># e confirmar a inclusão deverá estar definida no contrato de teste.</span>
        <span class="ce-c1"># Após a inclusão, o ID do ativo criado está disponível para comparação.</span>
        <span class="ce-c1"># O teste deverá verificar o registro de auditoria correspondente,</span>
        <span class="ce-c1"># contendo o ID desse ativo, o utilizador responsável, a data e a hora.</span>
        <span class="ce-c1"># A preparação deverá permitir conferir data e hora de forma repetível,</span>
        <span class="ce-c1"># sem presumir um fuso, formato ou tolerância que não foi definido.</span>
        <span class="ce-c1"># Esses dados não são campos que a pessoa precisa digitar no formulário.</span>
        <span class="ce-c1"># O meio de consultar a auditoria deverá ser definido antes de implementar</span>

        <span class="ce-k">raise</span> <span class="ce-ne">NotImplementedError</span><span class="ce-p">(</span><span class="ce-s2">"Faltam os contratos de inclusão e de consulta da auditoria."</span><span class="ce-p">)</span></code></pre></template>
