[project]
name = "vvts-courseware"
version = "0.1.0"
description = "Material didático Quarto de Verificação, Validação e Testes de Software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jupyter>=1.1.1",
  "nbformat>=5.10.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
]
visual-audit = [
  "playwright>=1.51.0",
]

[project.scripts]
render-apostila = "scripts.render_apostila:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
